<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>আমার বাকির খাতা</title>
<meta name="theme-color" content="#C8102E" />
<meta name="description" content="দোকানের বাকি ও কিস্তি হিসাব রাখার অ্যাপ" />

<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="আমার বাকির খাতা" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Baloo+Da+2:wght@500;600;700;800&display=swap" rel="stylesheet" />

<style>
  :root{
    --clr-primary:#C8102E;
    --clr-primary-dark:#9A0C22;
    --clr-ink:#1B1B1F;
    --clr-ink-soft:#6B6B72;
    --clr-bg:#F3F2F0;
    --clr-card:#FFFFFF;
    --clr-line:#ECEBE8;
    --clr-owe-to-me:#D6304A;
    --clr-i-owe:#1E8A5F;
    --clr-gold:#E8B23D;
    --clr-fab:#D6304A;
    --clr-danger-bg:#FDEBEC;
    --clr-danger-text:#C21F3A;

    --font-display:'Baloo Da 2', 'Hind Siliguri', sans-serif;
    --font-body:'Hind Siliguri', sans-serif;

    --radius-lg:20px;
    --radius-md:14px;
    --radius-full:999px;

    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0; scrollbar-width:none;}
  html::-webkit-scrollbar, body::-webkit-scrollbar{ width:0; height:0; display:none; }
  .screen, .home-scroll{ scrollbar-width:none; }
  .screen::-webkit-scrollbar, .home-scroll::-webkit-scrollbar{ width:0; height:0; display:none; }
  body{
    font-family:var(--font-body);
    background:var(--clr-bg);
    color:var(--clr-ink);
    -webkit-font-smoothing:antialiased;
  }

  #app{
    max-width:480px;
    margin:0 auto;
    height:100vh;
    background:var(--clr-bg);
    position:relative;
    overflow:hidden;
  }
  @media (min-width:481px){
    #app{ box-shadow:0 0 40px rgba(0,0,0,.08); }
  }

  /* ================= CATEGORY: Auth Screen (adapted from reference design) ================= */
  .auth-screen{
    position:fixed; left:50%; top:0; bottom:0; transform:translateX(-50%);
    width:100%; max-width:480px;
    background:#FBF3E2;
    z-index:1000;
    overflow-y:auto;
    display:flex; flex-direction:column;
    padding:calc(38px + var(--safe-top)) 26px calc(30px + var(--safe-bottom));
    box-shadow:0 0 40px rgba(0,0,0,.08);
  }
  .auth-screen.hide{ display:none; }

  .auth-brand{ text-align:center; margin-bottom:26px; }
  .auth-brand-name{ font-family:var(--font-display); font-weight:700; font-size:25px; color:var(--clr-ink); }
  .auth-brand-tagline{ font-size:12.5px; color:var(--clr-ink-soft); margin-top:4px; font-weight:500; }

  .auth-badge{ align-self:center; color:var(--clr-ink-soft); font-weight:700; font-size:14.5px; margin-bottom:28px; text-align:center; letter-spacing:.2px; }

  .auth-panel{ flex:1; display:flex; flex-direction:column; }
  .auth-step{ display:none; flex-direction:column; }
  .auth-step.active{ display:flex; }

  .auth-account-row{ display:flex; align-items:center; justify-content:center; gap:8px; font-size:14px; color:var(--clr-ink-soft); font-weight:500; margin-bottom:26px; }
  .auth-account-row b{ color:var(--clr-ink); font-weight:700; }
  .auth-edit-pencil{ width:26px;height:26px; border-radius:50%; border:none; background:var(--clr-card); box-shadow:0 1px 5px rgba(0,0,0,.08); display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--clr-ink-soft); flex-shrink:0; }
  .auth-edit-pencil svg{width:13px;height:13px;}

  .auth-field-label{ font-size:12.5px; font-weight:700; color:var(--clr-ink-soft); margin-bottom:9px; text-align:center; }
  .auth-phone-input-wrap{ display:flex; align-items:center; gap:10px; border:1.6px solid var(--clr-line); border-radius:var(--radius-md); padding:14px 16px; background:var(--clr-card); margin-bottom:8px; }
  .auth-phone-input-wrap.error{ border-color:var(--clr-owe-to-me); }
  .auth-phone-prefix{ font-size:15px; font-weight:700; color:var(--clr-ink-soft); }
  .auth-phone-input-wrap input{ flex:1; border:none; outline:none; background:none; font-family:var(--font-body); font-size:16px; letter-spacing:.5px; color:var(--clr-ink); }
  .auth-hint{ min-height:16px; font-size:12px; color:var(--clr-owe-to-me); font-weight:600; text-align:center; margin-bottom:14px; }

  .auth-primary-btn{ width:100%; padding:16px; border:none; border-radius:var(--radius-full); background:linear-gradient(160deg, var(--clr-primary), var(--clr-primary-dark)); color:#fff; font-size:15.5px; font-weight:700; cursor:pointer; box-shadow:0 8px 18px rgba(198,16,46,.28); margin-top:6px; }
  .auth-primary-btn:active{ transform:scale(.98); }

  .auth-pin-title{ text-align:center; font-size:15.5px; font-weight:700; color:var(--clr-ink); margin-bottom:20px; }
  .auth-pin-boxes{ display:flex; justify-content:center; gap:12px; margin-bottom:8px; }
  .auth-pin-boxes .pin-box{ width:52px;height:58px; border:1.8px solid var(--clr-line); border-radius:var(--radius-md); background:var(--clr-card); display:flex; align-items:center; justify-content:center; font-size:24px; font-weight:700; color:var(--clr-ink); }
  .auth-pin-boxes .pin-box.filled{ border-color:var(--clr-primary); }
  .auth-pin-boxes.shake{ animation:authShake .38s ease; }
  @keyframes authShake{ 10%,90%{transform:translateX(-2px);} 20%,80%{transform:translateX(4px);} 30%,50%,70%{transform:translateX(-8px);} 40%,60%{transform:translateX(8px);} }

  .auth-forgot-row{ text-align:center; margin-top:20px; }
  .auth-forgot-btn{ display:inline-flex; align-items:center; gap:6px; background:none; border:none; font-size:13.5px; font-weight:600; color:var(--clr-i-owe); cursor:pointer; padding:6px; }
  .auth-forgot-btn svg{width:15px;height:15px;}

  .auth-spacer{ flex:1; }

  .auth-keypad{ display:none; grid-template-columns:repeat(3,1fr); gap:4px; margin-top:auto; padding-top:20px; }
  .auth-keypad.show{ display:grid; }
  .auth-key{ background:none; border:none; padding:16px 0; font-family:var(--font-display); font-size:24px; font-weight:600; color:var(--clr-ink); cursor:pointer; border-radius:14px; }
  .auth-key:active{ background:rgba(0,0,0,.05); }
  .auth-key.auth-key-del{ display:flex; align-items:center; justify-content:center; }
  .auth-key.auth-key-del svg{ width:24px;height:24px; }
  .auth-key.auth-key-empty{ pointer-events:none; }

  /* ================= CATEGORY: Report Filter Screen ================= */
  .rf-body{ padding:18px 16px; }
  .rf-date-row{ display:flex; align-items:center; gap:10px; margin-bottom:22px; }
  .rf-date-wrap{ flex:1; display:flex; align-items:center; gap:8px; border:1.4px solid var(--clr-line); border-radius:10px; padding:10px 12px; background:var(--clr-card); }
  .rf-date-wrap svg{ width:18px; height:18px; color:var(--clr-ink-soft); flex-shrink:0; }
  .rf-date-wrap input{ border:none; outline:none; font-size:14px; font-family:var(--font-body); color:var(--clr-ink); width:100%; background:transparent; }
  .rf-date-sep{ font-size:13px; font-weight:600; color:var(--clr-ink-soft); white-space:nowrap; }
  .rf-select{ width:100%; border:1.6px solid var(--clr-line); border-radius:12px; padding:14px 15px; font-size:14.5px; font-family:var(--font-body); color:var(--clr-ink); background:var(--clr-card); outline:none; margin-bottom:26px; }
  .rf-submit-btn{ width:100%; padding:15px; border:none; border-radius:12px; background:linear-gradient(160deg,#2b76d9,#1a56ad); color:#fff; font-weight:700; font-size:15px; cursor:pointer; box-shadow:0 8px 18px rgba(26,86,173,.28); }
  .rf-submit-btn:active{ transform:scale(.98); }

  /* ================= CATEGORY: Screen Router ================= */

  .screen{
    position:absolute; inset:0;
    overflow-y:auto;
    background:var(--clr-bg);
    transition:transform .3s cubic-bezier(.4,0,.2,1), opacity .3s ease;
  }
  #screen-home{ transform:translateX(0); z-index:1; overflow:hidden; display:flex; flex-direction:column; }
  #screen-addCustomer{ transform:translateX(100%); z-index:2; }
  #screen-reportFilter{ transform:translateX(100%); z-index:2; }
  #app.show-report #screen-reportFilter{ transform:translateX(0); }
  #screen-shopSettings{ transform:translateX(100%); z-index:2; }
  #app.show-shopsettings #screen-shopSettings{ transform:translateX(0); }
  #screen-appSettings{ transform:translateX(100%); z-index:2; }
  #app.show-appsettings #screen-appSettings{ transform:translateX(0); }
  #screen-purchaseHistory{ transform:translateX(100%); z-index:2; }
  #app.show-purchasehistory #screen-purchaseHistory{ transform:translateX(0); }
  #app.show-report #screen-home{ transform:translateX(-18%); filter:brightness(.92); }
  #screen-customerDetail{ transform:translateX(100%); z-index:3; }
  #screen-newDue{ transform:translateX(100%); z-index:4; }
  #screen-txDetail{ transform:translateX(100%); z-index:4; }
  #app.show-add #screen-addCustomer{ transform:translateX(0); }
  #app.show-add #screen-home{ transform:translateX(-18%); filter:brightness(.92); }
  #app.show-detail #screen-customerDetail{ transform:translateX(0); }
  #app.show-detail #screen-home{ transform:translateX(-18%); filter:brightness(.92); }
  #app.show-detail .fab, #app.show-detail .bottom-nav{ display:none; }
  #app.show-txdetail #screen-txDetail{ transform:translateX(0); }
  #app.show-txdetail #screen-customerDetail{ transform:translateX(-18%); filter:brightness(.92); }
  #app.show-txdetail .cd-bottom-actions{ display:none; }
  #app.show-newdue #screen-newDue{ transform:translateX(0); z-index:5; }
  #app.show-newdue #screen-customerDetail{ transform:translateX(-18%); filter:brightness(.92); }
  #app.show-newdue .fab, #app.show-newdue .bottom-nav, #app.show-newdue .cd-bottom-actions{ display:none; }
  #screen-customerEdit{ transform:translateX(100%); z-index:4; }
  #app.show-customeredit #screen-customerEdit{ transform:translateX(0); }
  #app.show-customeredit #screen-customerDetail{ transform:translateX(-18%); filter:brightness(.92); }
  #screen-newInstallment{ transform:translateX(100%); z-index:5; }
  #app.show-newinstallment #screen-newInstallment{ transform:translateX(0); }
  #app.show-newinstallment #screen-customerDetail{ transform:translateX(-18%); filter:brightness(.92); }
  #app.show-newinstallment .fab, #app.show-newinstallment .bottom-nav, #app.show-newinstallment .cd-bottom-actions{ display:none; }
  #screen-collectInstallment{ transform:translateX(100%); z-index:5; }
  #app.show-collectinstallment #screen-collectInstallment{ transform:translateX(0); }
  #app.show-collectinstallment #screen-customerDetail{ transform:translateX(-18%); filter:brightness(.92); }
  #app.show-collectinstallment .fab, #app.show-collectinstallment .bottom-nav, #app.show-collectinstallment .cd-bottom-actions{ display:none; }

  /* ================= CATEGORY: Home Fixed Top / Scrollable List ================= */
  .home-top{ flex-shrink:0; }
  .home-scroll{ flex:1; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch; }

  /* FAB & bottom nav live outside the screens so screen-slide transforms never move them */
  #app.show-add .fab, #app.show-add .bottom-nav{ display:none; }

  /* ================= CATEGORY: Header Section (Home) ================= */
  .header{
    background:linear-gradient(160deg, var(--clr-primary), var(--clr-primary-dark));
    padding:calc(18px + var(--safe-top)) 20px 22px;
    color:#fff;
    border-radius:0 0 26px 26px;
    position:relative;
    overflow:hidden;
  }
  .header::after{
    content:"";
    position:absolute; right:-40px; top:-40px;
    width:160px;height:160px;border-radius:50%;
    background:rgba(255,255,255,.06);
  }
  .header-row{display:flex; align-items:flex-start; justify-content:space-between; position:relative; z-index:1;}
  .shop-identity{display:flex; flex-direction:column; gap:4px;}
  .shop-name{ font-family:var(--font-display); font-weight:700; font-size:26px; line-height:1.1; letter-spacing:.2px; }
  .shop-plan-badge{ align-self:flex-start; font-size:11px; font-weight:600; background:rgba(255,255,255,.18); padding:3px 10px; border-radius:var(--radius-full); letter-spacing:.3px; }
  .header-icons{display:flex; gap:10px;}
  .icon-btn{ width:38px;height:38px;border-radius:50%; background:rgba(255,255,255,.14); border:none; display:flex;align-items:center;justify-content:center; color:#fff; cursor:pointer; transition:transform .15s ease, background .15s ease; position:relative; }
  .icon-btn:active{transform:scale(.9); background:rgba(255,255,255,.28);}
  .icon-btn svg{width:19px;height:19px;}
  #settingsBtn svg{color:var(--clr-gold);}
  .icon-btn .dot{ position:absolute; width:8px;height:8px; border-radius:50%; background:#FFD23F; border:1.5px solid var(--clr-primary-dark); top:2px; right:2px; }

  /* ================= CATEGORY: Banner Ad Section ================= */
  .banner-ad{ margin:16px 18px 0; background:#17181B; border-radius:var(--radius-lg); min-height:110px; display:flex;align-items:center;justify-content:center; color:#fff; font-family:var(--font-display); font-weight:700; font-size:22px; letter-spacing:.5px; text-align:center; padding:12px; cursor:pointer; background-image:radial-gradient(circle at 85% 20%, rgba(198,16,46,.35), transparent 55%); }
  .banner-ad small{display:block; font-family:var(--font-body); font-weight:500; font-size:11px; opacity:.55; margin-top:6px;}

  /* ================= CATEGORY: Quick Actions Row ================= */
  .quick-actions{ display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin:18px 14px 0; }
  .quick-action{ display:flex; flex-direction:column; align-items:center; gap:8px; background:none; border:none; cursor:pointer; padding:6px 2px; color:var(--clr-ink); }
  .quick-action .qa-icon{ width:46px;height:46px;border-radius:16px; display:flex;align-items:center;justify-content:center; background:var(--clr-card); box-shadow:0 2px 10px rgba(0,0,0,.05); }
  .quick-action .qa-icon svg{width:22px;height:22px;}
  .quick-action span{font-size:11.5px; font-weight:600; line-height:1.25;}
  .quick-action:active .qa-icon{transform:scale(.92);}

  /* ================= CATEGORY: Summary Stats Bar ================= */
  .summary-bar{ margin:20px 18px 0; background:var(--clr-card); border-radius:var(--radius-lg); display:flex; box-shadow:0 2px 14px rgba(0,0,0,.04); overflow:hidden; }

  .collapsible-header-section{ max-height:220px; opacity:1; overflow:hidden; transition:max-height .32s ease, opacity .22s ease; }
  #screen-home.collapsed-header .collapsible-header-section{ max-height:0; opacity:0; }

  /* ================= CATEGORY: List Filter Modal ================= */
  /* ================= CATEGORY: Side Menu Drawer ================= */
  .menu-drawer-overlay{ position:fixed; inset:0; background:rgba(15,15,20,.5); z-index:620; display:none; }
  .menu-drawer-overlay.show{ display:block; }
  .menu-drawer{ position:fixed; top:0; right:0; bottom:0; width:68%; max-width:320px; background:#fff; z-index:621; display:flex; flex-direction:column; padding:calc(20px + var(--safe-top)) 0 calc(20px + var(--safe-bottom)); transform:translateX(100%); transition:transform .28s cubic-bezier(.4,0,.2,1); box-shadow:-6px 0 24px rgba(0,0,0,.15); }
  .menu-drawer-overlay.show .menu-drawer{ transform:translateX(0); }
  .menu-drawer-header{ padding:0 20px 18px; border-bottom:1px solid var(--clr-line); margin-bottom:8px; }
  .menu-drawer-shopname{ font-family:var(--font-display); font-size:17px; font-weight:700; color:var(--clr-ink); }
  .menu-drawer-owner{ font-size:12.5px; color:var(--clr-ink-soft); margin-top:2px; }
  .menu-drawer-item{ display:flex; align-items:center; gap:13px; padding:15px 20px; background:none; border:none; width:100%; text-align:left; font-size:14.5px; font-weight:600; color:var(--clr-ink); cursor:pointer; font-family:inherit; }
  .menu-drawer-item svg{ width:19px; height:19px; color:var(--clr-ink-soft); flex-shrink:0; }
  .menu-drawer-item.logout{ margin-top:auto; color:var(--clr-primary); border-top:1px solid var(--clr-line); padding-top:18px; }
  .menu-drawer-item.logout svg{ color:var(--clr-primary); }

  /* ================= CATEGORY: Shop Settings Screen ================= */
  .ss-body{ padding:18px 16px; }
  .ss-name-row{ display:flex; align-items:center; justify-content:space-between; background:var(--clr-card); border-radius:14px; padding:16px; margin-bottom:20px; box-shadow:0 1px 4px rgba(0,0,0,.04); }
  .ss-name-display{ font-family:var(--font-display); font-size:17px; font-weight:700; color:var(--clr-ink); flex:1; }
  .ss-name-edit-input{ flex:1; border:none; outline:none; border-bottom:1.6px solid var(--clr-primary); font-size:17px; font-family:var(--font-display); font-weight:700; color:var(--clr-ink); padding:2px 0; }
  .ss-name-icon-btn{ width:32px; height:32px; border-radius:50%; border:none; background:#F1F1F3; display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; margin-left:10px; }
  .ss-name-icon-btn svg{ width:15px; height:15px; color:var(--clr-ink-soft); }
  .ss-name-icon-btn.confirm{ background:var(--clr-primary); }
  .ss-name-icon-btn.confirm svg{ color:#fff; }
  .ss-field{ margin-bottom:18px; }
  .ss-select{ width:100%; border:1.6px solid var(--clr-line); border-radius:12px; padding:13px 15px; font-size:14.5px; font-family:var(--font-body); color:var(--clr-ink); background:var(--clr-card); outline:none; }
  .ss-textarea{ width:100%; border:1.6px solid var(--clr-line); border-radius:12px; padding:13px 15px; font-size:14.5px; font-family:var(--font-body); color:var(--clr-ink); outline:none; resize:vertical; min-height:70px; }
  .ss-save-btn{ width:100%; padding:15px; border:none; border-radius:12px; background:linear-gradient(160deg, var(--clr-primary), var(--clr-primary-dark)); color:#fff; font-weight:700; font-size:15px; cursor:pointer; margin-top:6px; }

  /* ================= CATEGORY: Business Mode Settings ================= */
  .mode-card{ display:flex; align-items:center; gap:14px; background:var(--clr-card); border:2px solid var(--clr-line); border-radius:16px; padding:18px 16px; margin-bottom:14px; cursor:pointer; }
  .mode-card.selected{ border-color:var(--clr-primary); background:linear-gradient(160deg, #FFF6F2, #FFEFEA); }
  .mode-card-icon{ width:42px; height:42px; border-radius:12px; background:#F1F1F3; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .mode-card.selected .mode-card-icon{ background:var(--clr-primary); color:#fff; }
  .mode-card-icon svg{ width:21px; height:21px; color:var(--clr-ink-soft); }
  .mode-card.selected .mode-card-icon svg{ color:#fff; }
  .mode-card-text{ flex:1; }
  .mode-card-title{ font-size:15px; font-weight:700; color:var(--clr-ink); }
  .mode-card-desc{ font-size:12px; color:var(--clr-ink-soft); margin-top:2px; }
  .mode-card-check{ width:22px; height:22px; border-radius:50%; border:2px solid var(--clr-line); flex-shrink:0; display:flex; align-items:center; justify-content:center; }
  .mode-card.selected .mode-card-check{ background:var(--clr-primary); border-color:var(--clr-primary); }
  .mode-card-check svg{ width:12px; height:12px; color:#fff; opacity:0; }
  .mode-card.selected .mode-card-check svg{ opacity:1; }

  /* ================= CATEGORY: Wheel Date Picker (used everywhere) ================= */
  .wdp-overlay{ position:fixed; inset:0; background:rgba(15,15,20,.45); z-index:720; display:none; align-items:flex-end; justify-content:center; }
  .wdp-overlay.show{ display:flex; }
  .wdp-sheet{ width:100%; max-width:480px; background:#fff; border-radius:22px 22px 0 0; padding:20px 0 calc(16px + var(--safe-bottom)); }
  .wdp-title{ text-align:center; font-size:15px; font-we
